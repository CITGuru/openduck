#
# Main extension distribution pipeline.
#
# Builds the OpenDuck extension for every DuckDB community-extensions
# platform (minus the ones we know don't build), runs SQL logic tests,
# and (on tags / main) uploads the resulting binaries.
#
# Keep `excluded_archs` in sync with `extensions/openduck/description.yml`
# so the community-extensions builder agrees with our own CI.
#
name: Main Extension Distribution Pipeline
on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: true

jobs:
  duckdb-stable-build:
    name: Build extension binaries
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.5.1
    with:
      duckdb_version: v1.5.1
      ci_tools_version: v1.5.1
      extension_name: openduck
      # Provision cargo so the optional Postgres-backed bridge
      # (libdiff_bridge.a) can be linked into the loadable extension.
      extra_toolchains: 'rust'
      # Architectures we cannot build today:
      #   - wasm_*: Arrow C++ + gRPC do not build for emscripten
      #   - windows_amd64_mingw / _rtools: vcpkg gRPC + protobuf fail
      #     under MinGW; tonic/arrow-rs need an MSVC-compatible target
      #   - linux_*_musl: gRPC + Arrow on musl is not yet validated
      exclude_archs: 'wasm_mvp;wasm_eh;wasm_threads;windows_amd64_mingw;windows_amd64_rtools;linux_amd64_musl;linux_arm64_musl'

  code-quality-check:
    name: Code Quality Check
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_code_quality.yml@v1.5.1
    with:
      duckdb_version: v1.5.1
      ci_tools_version: v1.5.1
      extension_name: openduck
      format_checks: 'format;tidy'

  # Only run the deploy job on:
  #   - pushes to main / master  -> "nightly" channel
  #   - pushes of v* tags        -> "versioned" channel
  # Pull requests skip deploy (no secrets available).
  deploy:
    name: Deploy nightly artifacts
    needs: duckdb-stable-build
    if: >-
      github.event_name == 'push' &&
      (
        github.ref == 'refs/heads/main' ||
        github.ref == 'refs/heads/master' ||
        startsWith(github.ref, 'refs/tags/v')
      )
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_deploy.yml@v1.5.1
    secrets: inherit
    with:
      duckdb_version: v1.5.1
      ci_tools_version: v1.5.1
      extension_name: openduck
      deploy_latest: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
      deploy_versioned: ${{ startsWith(github.ref, 'refs/tags/v') }}
      exclude_archs: 'wasm_mvp;wasm_eh;wasm_threads;windows_amd64_mingw;windows_amd64_rtools;linux_amd64_musl;linux_arm64_musl'
